          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFeedbackResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    get:
      operationId: getConversationFeedback
