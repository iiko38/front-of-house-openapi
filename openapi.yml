  /v1/console/traces:
    get:
      operationId: listTraces
      tags: [ reporting ]
      summary: List agent turn traces
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl --request GET "$FOH_API_URL/v1/console/traces?limit=100" \\n              --header "Authorization: Bearer $FOH_SERVICE_TOKEN" \\n              --header "x-org-id: $FOH_ORG_ID"
        - lang: TypeScript
          label: TypeScript SDK
          source: |
            const traces = await client.reporting.listTraces({
              limit: 100,
            });
        - lang: Python
          label: Python SDK
          source: |
            import os
            from front_of_house_sdk import FohClient

            client = FohClient(
                token=os.environ["FOH_SERVICE_TOKEN"],
                org_id=os.environ["FOH_ORG_ID"],
                api_url=os.environ["FOH_API_URL"],
            )

            traces = client.traces.list()

      description: |
        Returns agent turn trace events in reverse chronological order.
        Optionally scoped to a specific agent or conversation. Results are
        capped at 200 per call — use `agentId` / `conversationId` filters
        for targeted queries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIdHeader'
        - name: agentId
          in: query
          schema:
            type: string
            format: uuid
        - name: conversationId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Max results (1–200, default 100)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Trace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTracesResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT issued by `/v1/console/auth/service-token`

  parameters:
    OrgIdHeader:
      name: x-org-id
      in: header
      required: true
      description: UUID of the target org
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key for safe retries (scoped per org, 24-hour TTL)
      schema:
        type: string
        maxLength: 255

    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required unique key for safe retries (scoped per org, 24-hour TTL)
      schema:
        type: string
        maxLength: 255

    AgentId:
      name: id
      in: path
      required: true
      description: Agent UUID
      schema:
        type: string
        format: uuid

    LeadId:
      name: id
      in: path
      required: true
      description: Lead UUID
      schema:
        type: string
        format: uuid

    ConversationId:
      name: id
      in: path
      required: true
      description: Conversation UUID
      schema:
        type: string
        format: uuid

    WebhookId:
      name: id
      in: path
      required: true
      description: Webhook registration UUID
      schema:
        type: string
        format: uuid

    TemplateId:
      name: id
      in: path
      required: true
      description: Template ID or slug
      schema:
        type: string

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller lacks required org permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not accessible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Resource has expired or is no longer available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Shared ─────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          type: string
          description: Human-readable error message
        detail:
          type: object
          description: Structured detail (validation errors, etc.)
          additionalProperties: true
        remediation:
          type: string
          description: Actionable hint for fixing the error

    OkResponse:
      type: object
      required: [ ok ]
      properties:
        ok:
          type: boolean
          enum: [ true ]

    # ── Auth ───────────────────────────────────────────────────────────────────

    VoiceProofOperatorSummary:
      type: object
      required: [ schema_version, status, source, customer_launch_ready_claim_allowed, proof_ladder, blocker_reason_codes, blocker_reason_code_count, next_command, operator_answer ]
      properties:
        schema_version:
          type: string
          enum: [ voice_proof_operator_summary.v1 ]
        status:
          type: string
          enum: [ passed, failed ]
        source:
          type: string
          enum: [ release_evidence, release_evidence_missing, agency_setup_preview ]
        customer_launch_ready_claim_allowed:
          type: boolean
          description: True only when the current release packet permits a customer/live voice launch claim.
        proof_ladder:
          type: object
          required: [ highest_passed_rung, next_blocked_rung, target_satisfied ]
          properties:
            highest_passed_rung:
              nullable: true
              type: string
              example: L1_TIMED_TRANSCRIPT
            next_blocked_rung:
              nullable: true
              type: string
              example: L2_SYNTHETIC_AUDIO_REPLAY
            target_satisfied:
              type: boolean
        blocker_reason_codes:
          type: array
          items:
            type: string
        blocker_reason_code_count:
          type: integer
          minimum: 0
        next_command:
          type: string
          description: Operator command to run next, or `none` when voice is launch-ready.
        operator_answer:
          type: string
          description: Human-readable launch-readiness answer for operators.

    ServiceTokenRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    ServiceTokenResponse:
      type: object
      required: [ token, expires_at ]
      properties:
        token:
          type: string
          description: Bearer token for all subsequent requests
        expires_at:
          type: string
          format: date-time
          description: ISO-8601 expiry timestamp

    DeviceAuthStartRequest:
      type: object
      properties:
        client:
          type: string
          description: Optional client label for diagnostics

    DeviceAuthStartResponse:
      type: object
      required: [ device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval ]
      properties:
        device_code:
          type: string
          description: High-entropy secret used only by the CLI poller
        user_code:
          type: string
          example: ABCD-2345
        verification_uri:
          type: string
          format: uri
        verification_uri_complete:
          type: string
          format: uri
        expires_in:
          type: integer
          example: 600
        interval:
          type: integer
          example: 2

    DeviceAuthApproveRequest:
      type: object
      properties:
        device_code:
          type: string
        user_code:
          type: string
          example: ABCD-2345
      anyOf:
        - required: [ device_code ]
        - required: [ user_code ]

    DeviceAuthApproveResponse:
      type: object
      required: [ status, expires_at ]
      properties:
        status:
          type: string
          enum: [ approved ]
        user_code:
          type: string
        expires_at:
          type: string
          format: date-time

    DeviceAuthPollRequest:
      type: object
      required: [ device_code ]
      properties:
        device_code:
          type: string

    DeviceAuthPendingResponse:
      type: object
      required: [ status, code ]
      properties:
        status:
          type: string
          enum: [ authorization_pending ]
        code:
          type: string
          enum: [ authorization_pending ]

    DeviceAuthPollApprovedResponse:
      type: object
      required: [ status, token, expires_at ]
      properties:
        status:
          type: string
          enum: [ approved ]
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    MyOrgsResponse:
      type: object
      required: [ orgs ]
      properties:
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/OrgMembership'

    OrgMembership:
      type: object
      required: [ org_id, org_name, plan, role ]
      properties:
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        plan:
          type: string
          enum: [ bronze, silver, gold, internal ]
        role:
          type: string
          enum: [ owner, admin, member, viewer ]

    # ── Agents ─────────────────────────────────────────────────────────────────

    Agent:
      type: object
      required: [ id, org_id, name, type, is_active, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [ custom, inbound_buyer, inbound_landlord ]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sim_cert_at:
          type: [ string, "null" ]
          format: date-time
          description: Timestamp of latest passing simulation cert

    PolicyDraft:
      type: object
      description: |
        Policy flow draft — free-form JSON conforming to the internal
        FlowDraftSchema. Use `/v1/console/agents/{id}/validate` to check
        validity before publishing. Top-level fields commonly used:
        `greeting`, `goodbye`, `nodes`, `name`, `speech_settings`.
      additionalProperties: true

    CreateAgentRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [ custom, inbound_buyer, inbound_landlord ]
          default: custom

    CreateAgentResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          required: [ agent ]
          properties:
            agent:
              $ref: '#/components/schemas/Agent'

    ListAgentsResponse:
      type: object
      required: [ agents ]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    # Templates

    TemplateCategory:
      type: string
      enum: [ buyer, seller, landlord, commercial ]

    Template:
      type: object
      required: [ id, name, category, description ]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/TemplateCategory'
        description:
          type: string
        created_at:
          type: string
          format: date-time
        draft_config:
          type: object
          additionalProperties: true
        is_system:
          type: boolean
        recommended_for:
          type: array
          items:
            type: string
        certification_profile:
          type: string
        template_contract:
          type: object
          additionalProperties: true
      additionalProperties: true

    ListTemplatesResponse:
      type: object
      required: [ templates ]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'

    GetTemplateResponse:
      type: object
      required: [ template ]
      properties:
        template:
          $ref: '#/components/schemas/Template'

    KnowledgeSource:
      type: object
      required: [ type, label ]
      properties:
        type:
          type: string
          enum: [ website, document, manual_text, crm, property_feed ]
        label:
          type: string
        uri:
          type: string

    BusinessRequirementBrief:
      type: object
      required: [ schema_version, business_name, industry, desired_use_cases, channels, required_outcomes ]
      properties:
        schema_version:
          type: string
          enum: [ business_requirement_brief.v1 ]
        business_name:
          type: string
        industry:
          type: string
          enum: [ real_estate, general ]
        desired_use_cases:
          type: array
          minItems: 1
          items:
            type: string
        channels:
          type: array
          minItems: 1
          items:
            type: string
            enum: [ widget, voice, whatsapp, instagram, sms ]
        knowledge_sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
        required_outcomes:
          type: array
          minItems: 1
          items:
            type: string
        handoff_rules:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        optimization_target:
          type: string
          enum: [ lead_quality, booking_rate, speed_to_lead, support_resolution, cost_efficiency ]
          default: lead_quality

    TemplateMissingInput:
      type: object
      required: [ key, label, source ]
      properties:
        key:
          type: string
        label:
          type: string
        source:
          type: string

    TemplateToolAvailabilityMatrixRow:
      type: object
      required: [ tool_id, declared_required, expected_evidence_surfaces, happy_path_scenario_ids, failure_or_fallback_scenario_ids ]
      properties:
        tool_id:
          type: string
        declared_required:
          type: boolean
        expected_evidence_surfaces:
          type: array
          items:
            type: string
            enum: [ api, cli, sdk, transcript, proof_report ]
        happy_path_scenario_ids:
          type: array
          items:
            type: string
        failure_or_fallback_scenario_ids:
          type: array
          items:
            type: string

    TemplateVoiceOption:
      type: object
      required: [ option_id, provider, voice, language, selection_priority, supports_no_spend ]
      properties:
        option_id:
          type: string
        provider:
          type: string
        voice:
          type: string
        language:
          type: string
        accent:
          type: string
        selection_priority:
          type: integer
          minimum: 1
        supports_no_spend:
          type: boolean

    TemplateVoiceFallback:
      type: object
      required: [ from_option_id, mode, reason_code ]
      properties:
        from_option_id:
          type: string
        to_option_id:
          type: string
        mode:
          type: string
          enum: [ fallback_option, expected_hold ]
        reason_code:
          type: string

    TemplateSelectionCapabilities:
      type: object
      required: [ schema_version, template_id, template_slug, use_case, delivery_mechanisms, tools, voice, proof_gates ]
      properties:
        schema_version:
          type: string
          enum: [ template_selection_capabilities.v1 ]
        template_id:
          type: string
        template_slug:
          type: string
        use_case:
          type: string
        delivery_mechanisms:
          type: array
          items:
            type: string
            enum: [ widget, voice, whatsapp, instagram, sms ]
        tools:
          type: object
          required: [ total_declared, required_count, ids, availability_matrix ]
          properties:
            total_declared:
              type: integer
            required_count:
              type: integer
            ids:
              type: array
              items:
                type: string
            availability_matrix:
              type: array
              items:
                $ref: '#/components/schemas/TemplateToolAvailabilityMatrixRow'
        voice:
          type: object
          required: [ enabled, no_spend_semantics, expected_hold_reason_codes, options, fallback_chain ]
          properties:
            enabled:
              type: boolean
            no_spend_semantics:
              type: string
              enum: [ expected_hold, not_supported ]
            expected_hold_reason_codes:
              type: array
              items:
                type: string
            options:
              type: array
              items:
                $ref: '#/components/schemas/TemplateVoiceOption'
            fallback_chain:
              type: array
              items:
                $ref: '#/components/schemas/TemplateVoiceFallback'
        proof_gates:
          type: array
          items:
            type: object
            required: [ id, channels, required ]
            properties:
              id:
                type: string
              channels:
                type: array
                items:
                  type: string
                  enum: [ widget, voice, whatsapp, instagram, sms ]
              required:
                type: boolean
              command:
                type: string

    TemplateSelectionCandidate:
      type: object
      required: [ template, match_score, matched_reasons, missing_inputs, capabilities, next_commands ]
      properties:
        template:
          $ref: '#/components/schemas/Template'
        match_score:
          type: number
        matched_reasons:
          type: array
          items:
            type: string
        missing_inputs:
          type: array
          items:
            $ref: '#/components/schemas/TemplateMissingInput'
        capabilities:
          $ref: '#/components/schemas/TemplateSelectionCapabilities'
        next_commands:
          type: array
          items:
            type: string

    TemplateSelectionResponse:
      type: object
      required: [ schema_version, candidates ]
      properties:
        schema_version:
          type: string
          enum: [ template_selection.v1 ]
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSelectionCandidate'

    GetTemplateCapabilitiesResponse:
      type: object
      required: [ capabilities ]
      properties:
        capabilities:
          $ref: '#/components/schemas/TemplateSelectionCapabilities'

    TemplateProofPlanRequest:
      type: object
      required: [ agent_id ]
      properties:
        agent_id:
          type: string

    TemplateProofPlan:
      type: object
      required: [ schema_version, template_id, template_slug, template_name, use_case, agent_id, outcome, lineage, commands, next_commands ]
      properties:
        schema_version:
          type: string
          enum: [ template_proof_plan.v1 ]
        template_id:
          type: string
        template_slug:
          type: string
        template_name:
          type: string
        use_case:
          type: string
        agent_id:
          type: string
        outcome:
          type: object
          required: [ primary_outcome, required_lead_fields ]
          properties:
            primary_outcome:
              type: string
            required_lead_fields:
              type: array
              items:
                type: string
        lineage:
          type: object
          required: [ source_template_id, source_template_slug, clone_mode ]
          properties:
            source_template_id:
              type: string
            source_template_slug:
              type: string
            clone_mode:
              type: string
        commands:
          type: array
          items:
            type: object
            required: [ gate_id, mission, command, expected_status, pass_criteria ]
            properties:
              gate_id:
                type: string
              mission:
                type: string
                enum: [ widget, voice, certification, other ]
              command:
                type: string
              expected_status:
                type: string
                enum: [ pass, pass_or_expected_hold ]
              environment:
                type: object
                additionalProperties:
                  type: string
              accepted_hold_reason_codes:
                type: array
                items:
                  type: string
              pass_criteria:
                type: array
                items:
                  type: string
        next_commands:
          type: array
          items:
            type: string

    GetTemplateProofPlanResponse:
      type: object
      required: [ plan ]
      properties:
        plan:
          $ref: '#/components/schemas/TemplateProofPlan'

    TemplateForkRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        category:
          $ref: '#/components/schemas/TemplateCategory'
        contract:
          type: object
          additionalProperties: true

    TemplateForkResponse:
      type: object
      required: [ schema_version, template, diff ]
      properties:
        schema_version:
          type: string
          enum: [ template_fork.v1 ]
        template:
          type: object
          required: [ id, source_template_id, name, category, description, template_contract, lineage ]
          properties:
            id:
              type: string
            source_template_id:
              type: string
            name:
              type: string
            category:
              $ref: '#/components/schemas/TemplateCategory'
            description:
              type: string
            template_contract:
              type: object
              additionalProperties: true
            lineage:
              type: object
              additionalProperties: true
        diff:
          type: object
          required: [ changed_keys, customizable_changes, preserved_changes, preserved_fields ]
          properties:
            changed_keys:
              type: array
              items:
                type: string
            customizable_changes:
              type: array
              items:
                type: string
            preserved_changes:
              type: array
              items:
                type: string
            preserved_fields:
              type: array
              items:
                type: string

    TemplatePublishEvidence:
      type: object
      required: [ schema_version, template_id, applied_proof_status, day_end_status, use_case_score_verdict ]
      properties:
        schema_version:
          type: string
          enum: [ template_publish_evidence.v1 ]
        template_id:
          type: string
        template_slug:
          type: string
        applied_proof_status:
          type: string
          enum: [ passed, failed ]
        day_end_status:
          type: string
          enum: [ passed, failed ]
        use_case_score_verdict:
          type: string
          enum: [ can_customer_demo, expected_hold, product_bug, runner_blocked, unsafe ]
        expected_holds:
          type: array
          items:
            type: string
        draft_hash:
          type: string

    TemplatePublishHelperRequest:
      type: object
      required: [ agent_id, evidence ]
      properties:
        agent_id:
          type: string
        evidence:
          $ref: '#/components/schemas/TemplatePublishEvidence'

    TemplatePublishHelperResponse:
      type: object
      required: [ ok, schema_version, status, template_id, agent_id, use_case_score_verdict, expected_holds, publish_request, next_commands ]
      properties:
        ok:
          type: boolean
        schema_version:
          type: string
          enum: [ template_publish_helper.v1 ]
        status:
          type: string
          enum: [ publish_ready ]
        template_id:
          type: string
        agent_id:
          type: string
        use_case_score_verdict:
          type: string
          enum: [ can_customer_demo, expected_hold, product_bug, runner_blocked, unsafe ]
        expected_holds:
          type: array
          items:
            type: string
        publish_request:
          type: object
          required: [ path, method, body ]
          properties:
            path:
              type: string
            method:
              type: string
              enum: [ POST ]
            body:
              type: object
              additionalProperties: true
        next_commands:
          type: array
          items:
            type: string

    ApplyTemplateRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    ApplyTemplateResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          required: [ agent ]
          properties:
            agent:
              $ref: '#/components/schemas/Agent'

    PatchAgentDraftRequest:
      type: object
      description: Fields to merge into the existing draft
      properties:
        name:
          type: string
          description: Rename the agent
        greeting:
          type: string
          description: Conversation opening message
        goodbye:
          type: string
          description: Conversation close message
        voice:
          type: object
          description: Speech settings shorthand
          properties:
            tts_provider:
              type: string
              enum: [ azure, openai, twilio, cartesia, elevenlabs, xai ]
            tts_voice_id:
              type: string
            stt_provider:
              type: string
      additionalProperties: true

    ValidateDraftRequest:
      type: object
      required: [ flowDraft ]
      properties:
        flowDraft:
          $ref: '#/components/schemas/PolicyDraft'

    ValidateDraftResponse:
      type: object
      required: [ ok ]
      properties:
        ok:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    ConversationBlueprintV1:
      type: object
      required:
        - schema_version
        - name
        - objective
        - audience
        - persona
        - channel_policy
        - turn_taking_policy
        - phases
        - tool_policy
        - escalation_policy
        - close_policy
        - evaluation_scenarios
      properties:
        schema_version:
          type: string
          enum: [ conversation_blueprint.v1 ]
        name:
          type: string
        objective:
          type: string
        audience:
          type: string
        persona:
          type: object
          required: [ role, brand_voice ]
          properties:
            role:
              type: string
            brand_voice:
              type: string
            boundaries:
              type: array
              items:
                type: string
        channel_policy:
          type: object
          properties:
            primary:
              type: string
              enum: [ widget, voice, whatsapp, instagram, sms ]
            allowed:
              type: array
              items:
                type: string
                enum: [ widget, voice, whatsapp, instagram, sms ]
            voice_style:
              type: string
              enum: [ concise, natural, guided ]
            async_follow_up:
              type: boolean
        turn_taking_policy:
          type: object
          properties:
            max_questions_per_turn:
              type: integer
              minimum: 1
              maximum: 3
            interruption_style:
              type: string
              enum: [ brief_acknowledge_then_continue, stop_and_answer, defer ]
            repair_strategy:
              type: string
              enum: [ ask_clarifying_question, offer_menu, handoff ]
        phases:
          type: array
          minItems: 1
          items:
            type: object
            required: [ id, label, goal, success_signal ]
            properties:
              id:
                type: string
              label:
                type: string
              goal:
                type: string
              success_signal:
                type: string
              required_slots:
                type: array
                items:
                  type: string
        slots:
          type: array
          items:
            type: object
            required: [ key, label, ask_when_missing ]
            properties:
              key:
                type: string
              label:
                type: string
              required:
                type: boolean
              ask_when_missing:
                type: string
        tool_policy:
          type: object
          properties:
            allowed_tools:
              type: array
              items:
                type: string
            require_confirmation_before:
              type: array
              items:
                type: string
            failure_mode:
              type: string
              enum: [ apologize_and_continue, handoff, retry_once ]
        escalation_policy:
          type: object
          properties:
            triggers:
              type: array
              items:
                type: string
            handoff_message:
              type: string
        close_policy:
          type: object
          required: [ success_outcome, follow_up_message ]
          properties:
            success_outcome:
              type: string
            follow_up_message:
              type: string
        evaluation_scenarios:
          type: array
          minItems: 1
          items:
            type: object
            required: [ id, user_goal ]
            properties:
              id:
                type: string
              channel:
                type: string
                enum: [ widget, voice, whatsapp, instagram, sms ]
              user_goal:
                type: string
              must_collect:
                type: array
                items:
                  type: string
              must_not_do:
                type: array
                items:
                  type: string

    CompileAgentBlueprintRequest:
      type: object
      required: [ blueprint ]
      properties:
        blueprint:
          $ref: '#/components/schemas/ConversationBlueprintV1'
        apply:
          type: boolean
          default: false

    CompileAgentBlueprintResponse:
      type: object
      required: [ ok, applied, authoring_model, draft_hash, validation, draft ]
      properties:
        ok:
          type: boolean
        applied:
          type: boolean
        authoring_model:
          type: string
          enum: [ conversation_blueprint.v1 ]
        draft_hash:
          type: string
        validation:
          type: object
          properties:
            valid:
              type: boolean
            errors:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
            confidence:
              type: number
        draft:
          $ref: '#/components/schemas/PolicyDraft'

    PublishAgentRequest:
      type: object
      properties:
        break_glass:
          type: object
          description: Break-glass gate bypass — admin/owner only. Writes mandatory audit record.
          required: [ reason, incident_id ]
          properties:
            reason:
              type: string
              minLength: 10
            incident_id:
              type: string
              minLength: 1

    PublishAgentResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          properties:
            version:
              type: integer
              description: Published policy version number
            published_at:
              type: string
              format: date-time

    GateFailureResponse:
      type: object
      required: [ error, gate ]
      properties:
        error:
          type: string
        gate:
          type: string
          enum: [ sim_cert, eval_loop ]
          description: Which gate blocked publishing
        detail:
          type: object
          additionalProperties: true

    AgentReadiness:
      type: object
      required: [ agent_id, level ]
      properties:
        agent_id:
          type: string
          format: uuid
        level:
          type: string
          enum: [ not_ready, sim_certified, published, live_ready ]
        sim_cert_at:
          type: [ string, "null" ]
          format: date-time
        is_active:
          type: boolean
        gates:
          type: object
          additionalProperties: true

    # ── Leads ──────────────────────────────────────────────────────────────────

    HandoffRequest:
      type: object
      properties:
        reason:
          type: string
          description: Human-readable reason for handoff
        assigned_to:
          type: [ string, "null" ]
          format: uuid
          description: User UUID to assign to (null or omit for unassigned)

    HandoffResponse:
      type: object
      required: [ ok ]
      properties:
        ok:
          type: boolean
        lead_id:
          type: string
          format: uuid
        conversation_id:
          type: [ string, "null" ]
          format: uuid
        assigned_to:
          type: [ string, "null" ]
          format: uuid

    ExtractionFields:
      type: object
      description: |
        Key-value pairs of extracted fields. Empty string clears the field.
        Known keys: `budget`, `timeframe`, `position`, `property_ref`,
        `name`, `email`, `phone`. Unknown keys are stored in `full_extraction`.
      additionalProperties:
        type: [ string, "null" ]

    UpdateExtractionRequest:
      type: object
      properties:
        fields:
          $ref: '#/components/schemas/ExtractionFields'
        summary:
          type: string
          description: Human-readable AI summary of the lead's intent
        source:
          type: string
          enum: [ manual, ai, integration ]
          default: manual
        locked_fields:
          type: array
          items:
            type: string
          description: Fields locked from further AI overwrite

    ExtractionDiff:
      type: object
      properties:
        added:
          type: object
          additionalProperties: true
        updated:
          type: object
          additionalProperties:
            type: object
            properties:
              from:
                x-stainless-any: true
              to:
                x-stainless-any: true
        removed:
          type: array
          items:
            type: string

    UpdateExtractionResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          required: [ diff ]
          properties:
            diff:
              $ref: '#/components/schemas/ExtractionDiff'

    # ── Conversations ──────────────────────────────────────────────────────────

    ConversationReplyRequest:
      type: object
      required: [ content ]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        source:
          type: string
          enum: [ console, cli, api ]
        metadata:
          type: object
          additionalProperties: true

    ConversationReplyDelivery:
      type: object
      required: [ id, status, transport, recipient ]
      properties:
        id:
          type: [ string, 'null' ]
        status:
          type: string
          enum: [ queued, stored_only ]
        transport:
          type: string
          description: Channel transport key (`whatsapp`, `instagram_dm`, `widget`, etc.).
        recipient:
          type: [ string, 'null' ]

    ConversationReplyQueuedResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          required: [ delivery ]
          properties:
            delivery:
              allOf:
                - $ref: '#/components/schemas/ConversationReplyDelivery'
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [ queued ]
                    id:
                      type: string
                    recipient:
                      type: string

    ConversationReplyStoredResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          required: [ delivery ]
          properties:
            delivery:
              allOf:
                - $ref: '#/components/schemas/ConversationReplyDelivery'
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [ stored_only ]
                    id:
                      type: 'null'
                    recipient:
                      type: 'null'

    ConversationFeedbackRequest:
      type: object
      required: [ rating ]
      properties:
        rating:
          type: integer
          minimum: -1
          maximum: 1
          description: "-1 = negative, 0 = neutral, 1 = positive"
        note:
          type: [ string, "null" ]
          maxLength: 2000

    FeedbackRecord:
      type: object
      properties:
        conversation_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: -1
          maximum: 1
        note:
          type: [ string, "null" ]
        created_by:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time

    ConversationFeedbackResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          required: [ feedback ]
          properties:
            feedback:
              $ref: '#/components/schemas/FeedbackRecord'

    GetFeedbackResponse:
      type: object
      required: [ feedback ]
      properties:
        feedback:
          oneOf:
            - $ref: '#/components/schemas/FeedbackRecord'
            - type: 'null'

    # ── Webhooks ──────────────────────────────────────────────────────────────

    WebhookEventType:
      type: string
      enum:
        - lead.created
        - lead.handoff
        - lead.updated
        - agent.published
        - agent.rollback
        - conversation.ended
        - conversation.feedback_submitted
      description: Webhook event types

    RegisterWebhookRequest:
      type: object
      required: [ url, secret, events ]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint to deliver events to
        secret:
          type: string
          minLength: 16
          description: HMAC-SHA256 signing secret for payload verification
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'

    WebhookRegistration:
      type: object
      required: [ id, url, events, active, created_at ]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisterWebhookResponse:
      allOf:
        - $ref: '#/components/schemas/OkResponse'
        - type: object
          required: [ webhook ]
          properties:
            webhook:
              $ref: '#/components/schemas/WebhookRegistration'

    ListWebhooksResponse:
      type: object
      required: [ webhooks ]
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookRegistration'

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [ success, failed, retrying ]
        response_status:
          type: [ integer, "null" ]
        attempt:
          type: integer
        delivered_at:
          type: string
          format: date-time

    WebhookDeliveriesResponse:
      type: object
      required: [ deliveries ]
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'

    WebhookObservabilityResponse:
      type: object
      properties:
        total_attempts:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer
        failure_rate:
          type: number
          format: float
        backpressure_active:
          type: boolean
        hours:
          type: integer

    # ── Org ───────────────────────────────────────────────────────────────────

    CreateOrgRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        plan:
          type: string
          enum: [ bronze, silver, gold ]
          default: bronze

    Org:
      type: object
      required: [ id, name, plan ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
          enum: [ bronze, silver, gold, internal ]
        note:
          type: string
          enum: [ already_exists ]
          description: Present when a pre-existing org was returned

    OnboardingStep:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        complete:
          type: boolean

    OnboardingState:
      type: object
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        isLiveReady:
          type: boolean
        phone_number:
          type: [ string, "null" ]
        provisioning_status:
          type: [ string, "null" ]
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'

    OrgMember:
      type: object
      required: [ user_id, role ]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [ owner, admin, member, viewer ]
        created_at:
          type: string
          format: date-time

    ListMembersResponse:
      type: object
      required: [ members ]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrgMember'

    InviteMemberRequest:
      type: object
      required: [ email, role ]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ admin, member, viewer ]
          default: member

    InviteMemberResponse:
      type: object
      required: [ status, user_id, role ]
      properties:
        status:
          type: string
          enum: [ invited ]
        user_id:
          type: string
          format: uuid
        role:
          type: string

    # ── Reporting ─────────────────────────────────────────────────────────────

    TraceEvent:
      type: object
      required: [ id, org_id, event_type, created_at ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        agent_id:
          type: [ string, "null" ]
          format: uuid
        conversation_id:
          type: [ string, "null" ]
          format: uuid
        event_type:
          type: string
          enum: [ agent_input, agent_output, agent_step, tool_call, tool_response ]
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    ListTracesResponse:
      type: object
      required: [ traces ]
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceEvent'

security:
  - {}
