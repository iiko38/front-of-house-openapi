  /v1/console/voice-proof-summary:
    get:
      operationId: getVoiceProofSummary
      tags: [ voice ]
      summary: Get current voice proof ladder status and launch claim boundary
      description: |
        Returns the operator-facing voice proof state for the latest release
        evidence packet in the selected environment. If no packet exists, callers
        may provide agency setup-preview fields to see the expected fail-closed
        voice proof status before any customer/live claim is made.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIdHeader'
        - name: environment
          in: query
          required: false
          schema:
            type: string
          description: Optional release evidence environment filter.
        - name: agency_name
          in: query
          required: false
          schema:
            type: string
          description: Agency name for setup-preview fallback when no release packet exists.
        - name: source_url
          in: query
          required: false
          schema:
            type: string
            format: uri
          description: Official source URL for setup-preview fallback.
        - name: branch_location
          in: query
          required: false
          schema:
            type: string
          description: Branch or location for setup-preview fallback.
        - name: tools
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated requested tool surfaces for setup-preview fallback.
        - name: target_mode
          in: query
          required: false
          schema:
            type: string
            enum: [ founder_assisted_no_spend_demo, customer_owned_voice_trial, managed_number_live_trial, production_go_live ]
          description: Target exposure mode for setup-preview fallback.
      responses:
        "200":
          description: Voice proof operator summary
          content:
            application/json:
              schema:
                type: object
                required: [ summary, source ]
                properties:
                  summary:
                    $ref: '#/components/schemas/VoiceProofOperatorSummary'
                  source:
                    type: string
                    enum: [ release_evidence, release_evidence_missing, agency_setup_preview ]
                  setup_preview:
                    nullable: true
                    type: object
                    additionalProperties: true
                  evidence:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      environment:
                        type: string
                      artifact_sha:
                        type: string
                      artifact_path:
                        nullable: true
                        type: string
                      pipeline_run_id:
                        nullable: true
                        type: string
                      created_at:
                        type: string
                        format: date-time
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/ServerError'

