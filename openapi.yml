            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        "200":
          description: Webhook observability summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookObservabilityResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

